# Local development stack.
#   docker compose up -d                  -> Postgres (pgvector) + Azurite only; run API/web from your IDE
#   docker compose --profile app up -d    -> also runs the API and web containers
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d propertyplatform"]
      interval: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports: ["10000:10000"]

  migrations:
    profiles: [app]
    build: { context: src/api, dockerfile: Dockerfile.migrations }
    environment:
      ConnectionStrings__Platform: Host=postgres;Database=propertyplatform;Username=app_user;Password=app_dev_password
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: src/api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Database=propertyplatform;Username=app_user;Password=app_dev_password
      Cors__AllowedOrigins__0: http://localhost:3000
    ports: ["5080:8080"]
    depends_on:
      migrations: { condition: service_completed_successfully }

  web:
    profiles: [app]
    build: src/web
    environment:
      API_BASE_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
