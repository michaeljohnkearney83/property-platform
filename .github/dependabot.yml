version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/api
    schedule: { interval: weekly }
    groups:
      dotnet:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/web
    schedule: { interval: weekly }
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/src/api, /src/web]
    schedule: { interval: monthly }
