# CI: build, test, lint, Bicep validation and container builds.
# Runs on pushes to work branches, on every pull request, and is called by deploy.yml
# on every push to main (so main is tested exactly once, before images are published).
name: CI

on:
  push:
    branches: ['feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        description: Push the container images to GHCR (tagged with the commit SHA)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: src/api/**/*.csproj

      - name: Restore
        run: dotnet restore PropertyPlatform.sln

      - name: Format check
        run: dotnet format PropertyPlatform.sln --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build PropertyPlatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test PropertyPlatform.sln -c Release --no-build --logger trx --results-directory TestResults --collect "XPlat Code Coverage"

      - name: Vulnerable package check
        run: |
          dotnet list PropertyPlatform.sln package --vulnerable --include-transitive | tee vuln.txt
          if grep -q -E "Critical|High" vuln.txt; then echo "::error::High/Critical vulnerable NuGet packages found"; exit 1; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-results
          path: src/api/TestResults
          if-no-files-found: ignore

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev

  infra:
    name: Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: README contents menu is up to date
        run: |
          python3 scripts/readme-toc.py
          git diff --exit-code README.md || { echo "::error::README menu is stale - run: python scripts/readme-toc.py"; exit 1; }

      - name: Build and lint Bicep
        run: |
          az bicep install
          az bicep build -f infra/main.bicep --stdout > /dev/null
          az bicep lint -f infra/main.bicep
          for env in dev uat prod; do
            az bicep build-params -f infra/env/$env.bicepparam --stdout > /dev/null
          done

  images:
    # Explicit name keeps the required-check names stable: "Container image (api)" etc.
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [api, web, infra]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: src/api
            file: src/api/Dockerfile
          - name: migrations
            context: src/api
            file: src/api/Dockerfile.migrations
          - name: web
            context: src/web
            file: src/web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once here; deploy.yml imports these exact images into each environment's ACR.
      - name: Build ${{ matrix.name }} image${{ inputs.publish && ' and push' || ' (no push)' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ inputs.publish == true }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
