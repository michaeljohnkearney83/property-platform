# On every push to main: test once, publish images once, then promote the same images
#   dev  (automatic)
#   uat  (waits for the 'uat' environment's required reviewers - "dev is happy")
#   prod (ONLY when this push is a release, i.e. the release-please PR was merged,
#         and then waits for the 'prod' environment's required reviewers)
# Ordinary merges therefore stop at UAT; prod only ever runs versioned releases.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write

  # Keeps a "chore(main): release x.y.z" PR up to date from conventional PR titles.
  # Merging that PR creates the git tag, the GitHub Release and the CHANGELOG entry.
  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write          # release-please labels its release PRs
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          # A token is needed so CI runs on the release PR (PRs opened with GITHUB_TOKEN
          # don't trigger workflows, so its required checks would never report). See README.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When a release is cut, give the already-built images readable version tags too.
  tag-images:
    name: Tag release images
    needs: [ci, release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Add version tags
        run: |
          for img in api web migrations; do
            repo="ghcr.io/${{ github.repository }}/$img"
            docker buildx imagetools create \
              -t "$repo:${{ needs.release.outputs.version }}" \
              -t "$repo:latest" \
              "$repo:${{ github.sha }}"
          done

  dev:
    needs: ci
    # Set the repository variable DEPLOY_ENABLED=true once Azure is configured (see README).
    # Until then main is still tested and images are published, but nothing is deployed.
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read

  uat:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: uat
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read

  prod:
    needs: [uat, release]
    # Only versioned releases reach production.
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      packages: read
