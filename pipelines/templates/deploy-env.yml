# Deploys one environment. Required Azure DevOps setup per environment:
#   - Service connection  sc-propertyplatform-<env>  (Azure Resource Manager, workload identity federation)
#   - Variable group      propertyplatform-<env>     (POSTGRES_ADMIN_PASSWORD [secret], AUTH_AUTHORITY, AUTH_AUDIENCE)
#   - Environment         propertyplatform-<env>     (add an Approval check on prod)
parameters:
  - name: env
    type: string
  - name: dependsOn
    type: string
  - name: location
    type: string
    default: uksouth

stages:
  - stage: Deploy_${{ parameters.env }}
    displayName: Deploy ${{ parameters.env }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      - group: propertyplatform-${{ parameters.env }}
      - name: resourceGroup
        value: rg-propertyplatform-${{ parameters.env }}
      - name: serviceConnection
        value: sc-propertyplatform-${{ parameters.env }}
    jobs:
      - deployment: deploy
        environment: propertyplatform-${{ parameters.env }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: images
                - download: current
                  artifact: infra

                - task: AzureCLI@2
                  displayName: Infrastructure, migrations, release
                  env:
                    POSTGRES_ADMIN_PASSWORD: $(POSTGRES_ADMIN_PASSWORD)
                    AUTH_AUTHORITY: $(AUTH_AUTHORITY)
                    AUTH_AUDIENCE: $(AUTH_AUDIENCE)
                  inputs:
                    azureSubscription: $(serviceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      INFRA=$(Pipeline.Workspace)/infra
                      PARAMS=$INFRA/env/${{ parameters.env }}.bicepparam
                      RG=$(resourceGroup)
                      TAG=$(imageTag)

                      az group create -n "$RG" -l ${{ parameters.location }} --tags product=property-platform environment=${{ parameters.env }} -o none

                      # 1) First run only: create everything with placeholder images so the registry exists.
                      if [ -z "$(az acr list -g "$RG" --query '[0].name' -o tsv)" ]; then
                        echo "Bootstrap deployment (no registry yet)"
                        IMAGE_TAG="" az deployment group create -g "$RG" -f "$INFRA/main.bicep" -p "$PARAMS" -n "bootstrap-$TAG" -o none
                      fi

                      ACR=$(az acr list -g "$RG" --query '[0].name' -o tsv)
                      LOGIN=$(az acr show -n "$ACR" --query loginServer -o tsv)

                      # 2) Push the images built once in the Build stage.
                      az acr login -n "$ACR"
                      gunzip -c $(Pipeline.Workspace)/images/images.tar.gz | docker load
                      for img in api web migrations; do
                        docker tag propertyplatform-$img:$TAG $LOGIN/propertyplatform-$img:$TAG
                        docker push $LOGIN/propertyplatform-$img:$TAG
                      done

                      # 3) Run database migrations BEFORE the new API revision starts (expand/contract migrations only).
                      JOB=$(az containerapp job list -g "$RG" --query "[?ends_with(name,'-migrate')].name | [0]" -o tsv)
                      az containerapp job update -n "$JOB" -g "$RG" --image "$LOGIN/propertyplatform-migrations:$TAG" \
                        --registry-server "$LOGIN" --registry-identity "$(az identity list -g "$RG" --query '[0].id' -o tsv)" -o none
                      EXEC=$(az containerapp job start -n "$JOB" -g "$RG" --query name -o tsv)
                      echo "Migration execution: $EXEC"
                      for i in $(seq 1 90); do
                        STATUS=$(az containerapp job execution show -n "$JOB" -g "$RG" --job-execution-name "$EXEC" --query properties.status -o tsv)
                        echo "  status: $STATUS"
                        [ "$STATUS" = "Succeeded" ] && break
                        if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then echo "##vso[task.logissue type=error]Migrations failed"; exit 1; fi
                        sleep 10
                      done
                      [ "$STATUS" = "Succeeded" ] || { echo "##vso[task.logissue type=error]Migrations timed out"; exit 1; }

                      # 4) Deploy infrastructure + new app revisions with this commit's images.
                      IMAGE_TAG="$TAG" az deployment group create -g "$RG" -f "$INFRA/main.bicep" -p "$PARAMS" -n "release-$TAG" -o none

                      # 5) Smoke test.
                      API=$(az deployment group show -g "$RG" -n "release-$TAG" --query properties.outputs.apiUrl.value -o tsv)
                      WEB=$(az deployment group show -g "$RG" -n "release-$TAG" --query properties.outputs.webUrl.value -o tsv)
                      curl --fail --retry 10 --retry-delay 10 --retry-all-errors -sS "$API/health/ready"
                      curl --fail --retry 10 --retry-delay 10 --retry-all-errors -sS "$WEB/api/health"
                      echo "Deployed ${{ parameters.env }}: $WEB"
