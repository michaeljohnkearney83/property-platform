steps:
  - task: UseDotNet@2
    displayName: Use .NET 10 SDK
    inputs:
      packageType: sdk
      version: 10.0.x

  - script: dotnet restore src/api/PropertyPlatform.sln
    displayName: Restore

  - script: dotnet format src/api/PropertyPlatform.sln --verify-no-changes --no-restore
    displayName: Format check

  - script: dotnet build src/api/PropertyPlatform.sln -c Release --no-restore
    displayName: Build (warnings are errors)

  - script: dotnet test src/api/PropertyPlatform.sln -c Release --no-build --logger trx --collect "XPlat Code Coverage"
    displayName: Test

  - script: dotnet list src/api/PropertyPlatform.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt; ! grep -q -E "Critical|High" vuln.txt
    displayName: Vulnerable package check

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
