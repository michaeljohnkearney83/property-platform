# PR validation - runs on every GitHub pull request into main and reports status back to GitHub.
# Make it a required check in GitHub branch protection.
trigger: none

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  - job: api
    displayName: API (.NET)
    steps:
      - template: templates/dotnet-build-test.yml

  - job: web
    displayName: Web (Next.js)
    steps:
      - template: templates/web-build.yml

  - job: infra
    displayName: Infrastructure (Bicep)
    steps:
      - script: |
          az bicep install
          az bicep build -f infra/main.bicep --stdout > /dev/null
          az bicep lint -f infra/main.bicep
          for env in dev staging prod; do az bicep build-params -f infra/env/$env.bicepparam --stdout > /dev/null; done
        displayName: Build and lint Bicep

  - job: images
    displayName: Container images build
    steps:
      - script: |
          docker build -t api:pr src/api
          docker build -t web:pr src/web
          docker build -f src/api/Dockerfile.migrations -t migrations:pr src/api
        displayName: Docker build (no push)
