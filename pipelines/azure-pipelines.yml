# CI/CD - on merge to main: build once, then promote the same images Dev -> Staging -> Prod.
# Prod waits for the approval configured on the 'propertyplatform-prod' Azure DevOps Environment.
trigger:
  branches:
    include: [main]

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  imageTag: $(Build.SourceVersion)
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NEXT_TELEMETRY_DISABLED: 1

stages:
  - stage: Build
    jobs:
      - job: test
        displayName: Test API and Web
        steps:
          - template: templates/dotnet-build-test.yml
          - template: templates/web-build.yml

      - job: images
        displayName: Build container images
        dependsOn: test
        steps:
          - script: |
              set -e
              docker build -t propertyplatform-api:$(imageTag) src/api
              docker build -t propertyplatform-web:$(imageTag) src/web
              docker build -f src/api/Dockerfile.migrations -t propertyplatform-migrations:$(imageTag) src/api
              mkdir -p $(Build.ArtifactStagingDirectory)/images
              docker save propertyplatform-api:$(imageTag) propertyplatform-web:$(imageTag) propertyplatform-migrations:$(imageTag) \
                | gzip > $(Build.ArtifactStagingDirectory)/images/images.tar.gz
            displayName: Docker build
          - publish: $(Build.ArtifactStagingDirectory)/images
            artifact: images
          - publish: infra
            artifact: infra

  - template: templates/deploy-env.yml
    parameters:
      env: dev
      dependsOn: Build

  - template: templates/deploy-env.yml
    parameters:
      env: staging
      dependsOn: Deploy_dev

  - template: templates/deploy-env.yml
    parameters:
      env: prod
      dependsOn: Deploy_staging
